name: Deploy White Lights to Pages

on:
  push:
    branches:
      - claude/app-build-vjsurc
      - main
      - master
    paths:
      - 'white-lights/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: white-lights
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: white-lights/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Build
        # Served at https://<owner>.github.io/claude-ruankoch/ — base must match.
        run: npm run build
        env:
          VITE_BASE: /claude-ruankoch/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: white-lights/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
