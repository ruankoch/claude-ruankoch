<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Post Search</title>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        Helvetica, Arial, sans-serif;
      background: #000;
      color: #e7e9ea;
      min-height: 100vh;
    }

    /* ── Layout ────────────────────────────────────────────── */
    .layout {
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .sidebar-left {
      width: 275px;
      padding: 0 12px;
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .sidebar-left nav {
      padding: 12px 0;
    }

    .sidebar-left .logo {
      padding: 12px;
      margin-bottom: 4px;
    }

    .sidebar-left .logo svg {
      width: 28px;
      height: 28px;
      fill: #e7e9ea;
    }

    .main-col {
      width: 600px;
      border-left: 1px solid #2f3336;
      border-right: 1px solid #2f3336;
      min-height: 100vh;
    }

    .sidebar-right {
      width: 350px;
      padding: 0 24px;
    }

    /* ── Header ────────────────────────────────────────────── */
    .header-sticky {
      position: sticky;
      top: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 10;
      border-bottom: 1px solid #2f3336;
    }

    .header-title {
      padding: 12px 16px 4px;
      font-size: 20px;
      font-weight: 700;
    }

    .header-subtitle {
      padding: 0 16px 12px;
      font-size: 13px;
      color: #71767b;
    }

    /* ── Search Bar ────────────────────────────────────────── */
    .search-wrap {
      padding: 12px 16px;
      border-bottom: 1px solid #2f3336;
    }

    .search-box {
      display: flex;
      align-items: center;
      background: #202327;
      border: 1px solid #2f3336;
      border-radius: 9999px;
      padding: 0 16px;
      transition: border-color 0.2s, background 0.2s;
    }

    .search-box:focus-within {
      border-color: #1d9bf0;
      background: #000;
    }

    .search-box svg {
      width: 18px;
      height: 18px;
      fill: #71767b;
      flex-shrink: 0;
      transition: fill 0.2s;
    }

    .search-box:focus-within svg {
      fill: #1d9bf0;
    }

    .search-box input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #e7e9ea;
      font-size: 15px;
      padding: 12px 8px;
      font-family: inherit;
    }

    .search-box input::placeholder {
      color: #71767b;
    }

    .search-clear {
      display: none;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #1d9bf0;
      border: none;
      cursor: pointer;
      flex-shrink: 0;
    }

    .search-clear svg {
      width: 12px;
      height: 12px;
      fill: #000;
    }

    .search-clear.visible {
      display: flex;
    }

    /* ── CSV Upload ────────────────────────────────────────── */
    .upload-area {
      padding: 32px 16px;
      border-bottom: 1px solid #2f3336;
      text-align: center;
    }

    .upload-area.hidden {
      display: none;
    }

    .upload-dropzone {
      border: 2px dashed #2f3336;
      border-radius: 16px;
      padding: 48px 24px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }

    .upload-dropzone:hover,
    .upload-dropzone.drag-over {
      border-color: #1d9bf0;
      background: rgba(29, 155, 240, 0.04);
    }

    .upload-dropzone svg {
      width: 40px;
      height: 40px;
      fill: #1d9bf0;
      margin-bottom: 12px;
    }

    .upload-dropzone p {
      color: #71767b;
      font-size: 15px;
      line-height: 1.5;
    }

    .upload-dropzone p span {
      color: #1d9bf0;
      cursor: pointer;
    }

    .upload-dropzone p span:hover {
      text-decoration: underline;
    }

    .upload-hint {
      margin-top: 12px;
      font-size: 13px;
      color: #71767b;
    }

    #csv-file {
      display: none;
    }

    /* ── Post / Tweet card ─────────────────────────────────── */
    .post {
      display: flex;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid #2f3336;
      transition: background 0.15s;
      cursor: pointer;
    }

    .post:hover {
      background: rgba(231, 233, 234, 0.03);
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #333639;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 16px;
      color: #e7e9ea;
      overflow: hidden;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .post-body {
      flex: 1;
      min-width: 0;
    }

    .post-header {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px;
      line-height: 20px;
    }

    .display-name {
      font-weight: 700;
      font-size: 15px;
      color: #e7e9ea;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .verified-badge {
      display: inline-flex;
      align-items: center;
      flex-shrink: 0;
    }

    .verified-badge svg {
      width: 18px;
      height: 18px;
      fill: #1d9bf0;
    }

    .handle {
      color: #71767b;
      font-size: 15px;
      white-space: nowrap;
    }

    .sep {
      color: #71767b;
      font-size: 15px;
    }

    .timestamp {
      color: #71767b;
      font-size: 15px;
      white-space: nowrap;
    }

    .post-text {
      margin-top: 4px;
      font-size: 15px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
      overflow-wrap: anywhere;
    }

    .post-text .highlight {
      background: rgba(29, 155, 240, 0.25);
      border-radius: 2px;
      color: #e7e9ea;
    }

    .post-text a {
      color: #1d9bf0;
      text-decoration: none;
    }

    .post-text a:hover {
      text-decoration: underline;
    }

    /* ── Empty / status messages ────────────────────────────── */
    .status-msg {
      padding: 32px 16px;
      text-align: center;
      color: #71767b;
      font-size: 15px;
      line-height: 1.5;
    }

    .status-msg.hidden {
      display: none;
    }

    .result-count {
      padding: 8px 16px;
      font-size: 13px;
      color: #71767b;
      border-bottom: 1px solid #2f3336;
    }

    .result-count.hidden {
      display: none;
    }

    /* ── Right sidebar search ──────────────────────────────── */
    .sidebar-search {
      position: sticky;
      top: 0;
      padding-top: 12px;
    }

    .sidebar-footer {
      padding: 16px 0;
      font-size: 13px;
      color: #71767b;
    }

    .sidebar-footer a {
      color: #71767b;
      text-decoration: none;
    }

    .sidebar-footer a:hover {
      text-decoration: underline;
    }

    /* ── Responsive ────────────────────────────────────────── */
    @media (max-width: 1024px) {
      .sidebar-right {
        display: none;
      }
    }

    @media (max-width: 768px) {
      .sidebar-left {
        display: none;
      }

      .main-col {
        width: 100%;
        border-left: none;
        border-right: none;
      }
    }

    /* ── Scrollbar ─────────────────────────────────────────── */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #333639;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="layout">
    <!-- Left sidebar -->
    <aside class="sidebar-left">
      <nav>
        <div class="logo">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"
            />
          </svg>
        </div>
      </nav>
    </aside>

    <!-- Main column -->
    <main class="main-col">
      <div class="header-sticky">
        <div class="header-title" id="header-title">Posts</div>
        <div class="header-subtitle" id="header-subtitle">
          Upload a CSV or XLS file to get started
        </div>
      </div>

      <!-- Search -->
      <div class="search-wrap">
        <div class="search-box">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M10.25 3.75c-3.59 0-6.5 2.91-6.5 6.5s2.91 6.5 6.5 6.5c1.795 0 3.419-.726 4.596-1.904 1.178-1.177 1.904-2.801 1.904-4.596 0-3.59-2.91-6.5-6.5-6.5zm-8.5 6.5c0-4.694 3.806-8.5 8.5-8.5s8.5 3.806 8.5 8.5c0 1.986-.682 3.815-1.824 5.262l4.781 4.781-1.414 1.414-4.781-4.781c-1.447 1.142-3.276 1.824-5.262 1.824-4.694 0-8.5-3.806-8.5-8.5z"
            />
          </svg>
          <input
            type="text"
            id="search-input"
            placeholder="Search posts"
            autocomplete="off"
          />
          <button class="search-clear" id="search-clear" title="Clear search">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M6.7 6.7a1 1 0 0 1 1.4 0L12 10.6l3.9-3.9a1 1 0 1 1 1.4 1.4L13.4 12l3.9 3.9a1 1 0 0 1-1.4 1.4L12 13.4l-3.9 3.9a1 1 0 0 1-1.4-1.4L10.6 12 6.7 8.1a1 1 0 0 1 0-1.4z"
              />
            </svg>
          </button>
        </div>
      </div>

      <!-- Upload area -->
      <div class="upload-area" id="upload-area">
        <div class="upload-dropzone" id="upload-dropzone">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M3 17a1 1 0 0 1 1-1h16a1 1 0 1 1 0 2H4a1 1 0 0 1-1-1zm4.5-7.3 3.8-3.79V14a.75.75 0 0 0 1.5 0V5.91L16.6 9.7a.73.73 0 0 0 1.05 0 .74.74 0 0 0 0-1.06L12.3 3.3a.75.75 0 0 0-1.06 0L5.9 8.64a.75.75 0 0 0 1.06 1.06z"
            />
          </svg>
          <p>
            Drop your CSV or XLS file here or <span id="browse-trigger">browse</span>
          </p>
          <p class="upload-hint">
            Supports .csv, .xls, and .xlsx — Expected columns: date, text (and optionally username, handle)
          </p>
        </div>
        <input type="file" id="csv-file" accept=".csv,.xls,.xlsx" />
      </div>

      <!-- Result count -->
      <div class="result-count hidden" id="result-count"></div>

      <!-- Posts feed -->
      <div id="feed"></div>

      <!-- Status messages -->
      <div class="status-msg hidden" id="status-empty">
        No posts match your search.
      </div>
    </main>

    <!-- Right sidebar -->
    <aside class="sidebar-right">
      <div class="sidebar-search"></div>
      <div class="sidebar-footer">
        <span>CSV Post Search</span>
      </div>
    </aside>
  </div>

  <script>
    (() => {
      // ── State ──────────────────────────────────────────────
      let allPosts = [];
      let accountName = "";
      let accountHandle = "";

      // ── DOM refs ───────────────────────────────────────────
      const searchInput = document.getElementById("search-input");
      const searchClear = document.getElementById("search-clear");
      const feed = document.getElementById("feed");
      const uploadArea = document.getElementById("upload-area");
      const dropzone = document.getElementById("upload-dropzone");
      const fileInput = document.getElementById("csv-file");
      const browseTrigger = document.getElementById("browse-trigger");
      const headerTitle = document.getElementById("header-title");
      const headerSubtitle = document.getElementById("header-subtitle");
      const resultCount = document.getElementById("result-count");
      const statusEmpty = document.getElementById("status-empty");

      // ── CSV parsing ────────────────────────────────────────
      function parseCSV(text) {
        const rows = [];
        let current = "";
        let inQuotes = false;
        let row = [];

        for (let i = 0; i < text.length; i++) {
          const ch = text[i];
          const next = text[i + 1];

          if (inQuotes) {
            if (ch === '"' && next === '"') {
              current += '"';
              i++;
            } else if (ch === '"') {
              inQuotes = false;
            } else {
              current += ch;
            }
          } else {
            if (ch === '"') {
              inQuotes = true;
            } else if (ch === ",") {
              row.push(current.trim());
              current = "";
            } else if (ch === "\n" || (ch === "\r" && next === "\n")) {
              row.push(current.trim());
              current = "";
              if (row.length > 1 || row[0] !== "") rows.push(row);
              row = [];
              if (ch === "\r") i++;
            } else {
              current += ch;
            }
          }
        }

        row.push(current.trim());
        if (row.length > 1 || row[0] !== "") rows.push(row);

        return rows;
      }

      function normalizeHeader(h) {
        return h.toLowerCase().replace(/[^a-z0-9]/g, "");
      }

      function processCSV(text) {
        const rows = parseCSV(text);
        return processRows(rows);
      }

      // ── Rendering ──────────────────────────────────────────
      function escapeHTML(str) {
        const div = document.createElement("div");
        div.textContent = str;
        return div.innerHTML;
      }

      function linkify(html) {
        // URLs
        html = html.replace(
          /(https?:\/\/[^\s<]+)/g,
          '<a href="$1" target="_blank" rel="noopener">$1</a>'
        );
        // @mentions
        html = html.replace(
          /(^|[\s>])@(\w{1,15})/g,
          '$1<a href="https://x.com/$2" target="_blank" rel="noopener">@$2</a>'
        );
        // #hashtags
        html = html.replace(
          /(^|[\s>])#(\w+)/g,
          '$1<a href="https://x.com/hashtag/$2" target="_blank" rel="noopener">#$2</a>'
        );
        return html;
      }

      function highlightText(text, query) {
        if (!query) return linkify(escapeHTML(text));

        const escaped = escapeHTML(text);
        const regex = new RegExp(
          `(${query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")})`,
          "gi"
        );
        const highlighted = escaped.replace(
          regex,
          '<span class="highlight">$1</span>'
        );
        return linkify(highlighted);
      }

      function formatDate(d) {
        if (!d) return "";
        const now = new Date();
        const diffMs = now - d;
        const diffSec = Math.floor(diffMs / 1000);
        const diffMin = Math.floor(diffSec / 60);
        const diffHr = Math.floor(diffMin / 60);

        if (diffSec < 60) return `${diffSec}s`;
        if (diffMin < 60) return `${diffMin}m`;
        if (diffHr < 24) return `${diffHr}h`;

        const sameYear = d.getFullYear() === now.getFullYear();
        const months = [
          "Jan", "Feb", "Mar", "Apr", "May", "Jun",
          "Jul", "Aug", "Sep", "Oct", "Nov", "Dec",
        ];

        if (sameYear) {
          return `${months[d.getMonth()]} ${d.getDate()}`;
        }
        return `${months[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
      }

      function getInitial(name) {
        return name.charAt(0).toUpperCase();
      }

      function renderPosts(posts, query) {
        feed.innerHTML = "";

        if (posts.length === 0) {
          statusEmpty.classList.remove("hidden");
          resultCount.classList.add("hidden");
          return;
        }

        statusEmpty.classList.add("hidden");

        if (query) {
          resultCount.textContent = `${posts.length} result${posts.length !== 1 ? "s" : ""}`;
          resultCount.classList.remove("hidden");
        } else {
          resultCount.classList.add("hidden");
        }

        const fragment = document.createDocumentFragment();

        posts.forEach((p) => {
          const article = document.createElement("article");
          article.className = "post";

          const handleDisplay = p.handle.startsWith("@")
            ? p.handle
            : `@${p.handle}`;

          const dateStr = formatDate(p.date);
          const dateSep = dateStr
            ? `<span class="sep">·</span><span class="timestamp">${dateStr}</span>`
            : "";

          article.innerHTML = `
            <div class="avatar">${getInitial(p.name)}</div>
            <div class="post-body">
              <div class="post-header">
                <span class="display-name">${escapeHTML(p.name)}</span>
                <span class="handle">${escapeHTML(handleDisplay)}</span>
                ${dateSep}
              </div>
              <div class="post-text">${highlightText(p.text, query)}</div>
            </div>
          `;
          fragment.appendChild(article);
        });

        feed.appendChild(fragment);
      }

      // ── Search ─────────────────────────────────────────────
      function doSearch() {
        const q = searchInput.value.trim();
        searchClear.classList.toggle("visible", q.length > 0);

        if (!q) {
          renderPosts(allPosts, "");
          return;
        }

        const lower = q.toLowerCase();
        const filtered = allPosts.filter((p) =>
          p.text.toLowerCase().includes(lower)
        );
        renderPosts(filtered, q);
      }

      let debounceTimer;
      searchInput.addEventListener("input", () => {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(doSearch, 150);
      });

      searchClear.addEventListener("click", () => {
        searchInput.value = "";
        searchClear.classList.remove("visible");
        doSearch();
        searchInput.focus();
      });

      // ── XLS parsing (via SheetJS) ─────────────────────────
      function parseXLS(data) {
        const workbook = XLSX.read(data, { type: "array", cellDates: true });
        const sheetName = workbook.SheetNames[0];
        const sheet = workbook.Sheets[sheetName];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false, dateNF: 'yyyy-mm-dd hh:mm:ss' });
        return rows;
      }

      function processRows(rows) {
        if (rows.length < 2) return [];

        const headers = rows[0].map((h) => normalizeHeader(String(h)));

        const dateIdx = headers.findIndex((h) =>
          ["date", "datetime", "createdat", "timestamp", "time", "postedat"].includes(h)
        );
        const textIdx = headers.findIndex((h) =>
          ["text", "content", "body", "tweet", "tweettext", "post", "posttext", "fulltext"].includes(h)
        );
        const nameIdx = headers.findIndex((h) =>
          ["username", "name", "displayname", "user", "author", "authorname"].includes(h)
        );
        const handleIdx = headers.findIndex((h) =>
          ["handle", "screenname", "screen_name", "userhandle", "authorhandle"].includes(h)
        );

        if (textIdx === -1) {
          alert(
            'Could not find a "text" or "content" column. Please make sure the header row contains one of: text, content, body, tweet, post, fulltext.'
          );
          return [];
        }

        const posts = [];
        for (let i = 1; i < rows.length; i++) {
          const r = rows[i];
          if (!r || r.length === 0) continue;
          const postText = r[textIdx] != null ? String(r[textIdx]) : "";
          if (!postText) continue;

          let dateVal = null;
          if (dateIdx !== -1 && r[dateIdx]) {
            dateVal = new Date(r[dateIdx]);
            if (isNaN(dateVal.getTime())) dateVal = null;
          }

          const name = nameIdx !== -1 && r[nameIdx] ? String(r[nameIdx]) : "";
          const handle = handleIdx !== -1 && r[handleIdx] ? String(r[handleIdx]) : "";

          if (!accountName && name) accountName = name;
          if (!accountHandle && handle) accountHandle = handle;

          posts.push({
            date: dateVal,
            text: postText,
            name: name || accountName || "User",
            handle: handle || accountHandle || "@user",
          });
        }

        posts.sort((a, b) => {
          if (a.date && b.date) return b.date - a.date;
          if (a.date) return -1;
          if (b.date) return 1;
          return 0;
        });

        return posts;
      }

      // ── File upload ────────────────────────────────────────
      function loadPosts(posts) {
        if (posts.length === 0) return;

        uploadArea.classList.add("hidden");
        headerTitle.textContent = accountName || "Posts";
        headerSubtitle.textContent = posts.length + " posts";
        searchInput.value = "";
        doSearch();
      }

      function handleFile(file) {
        if (!file) return;

        const ext = file.name.split(".").pop().toLowerCase();
        const supported = ["csv", "xls", "xlsx"];

        if (!supported.includes(ext)) {
          alert("Please upload a .csv, .xls, or .xlsx file.");
          return;
        }

        accountName = "";
        accountHandle = "";

        if (ext === "csv") {
          const reader = new FileReader();
          reader.onload = (e) => {
            allPosts = processCSV(e.target.result);
            loadPosts(allPosts);
          };
          reader.readAsText(file);
        } else {
          const reader = new FileReader();
          reader.onload = (e) => {
            const data = new Uint8Array(e.target.result);
            const rows = parseXLS(data);
            allPosts = processRows(rows);
            loadPosts(allPosts);
          };
          reader.readAsArrayBuffer(file);
        }
      }

      browseTrigger.addEventListener("click", () => fileInput.click());
      dropzone.addEventListener("click", () => fileInput.click());

      fileInput.addEventListener("change", () => {
        if (fileInput.files.length) handleFile(fileInput.files[0]);
      });

      // Drag & drop
      ["dragenter", "dragover"].forEach((evt) =>
        dropzone.addEventListener(evt, (e) => {
          e.preventDefault();
          dropzone.classList.add("drag-over");
        })
      );

      ["dragleave", "drop"].forEach((evt) =>
        dropzone.addEventListener(evt, () =>
          dropzone.classList.remove("drag-over")
        )
      );

      dropzone.addEventListener("drop", (e) => {
        e.preventDefault();
        if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
      });

      // Prevent default browser drag behavior
      document.addEventListener("dragover", (e) => e.preventDefault());
      document.addEventListener("drop", (e) => e.preventDefault());
    })();
  </script>
</body>
</html>
